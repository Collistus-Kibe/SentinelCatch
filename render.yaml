services:
  - type: web
    name: sentinelcatch
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm install && npm run build && npm run migrate
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: sentinelcatch-db
          property: connectionString
      - key: GFW_API_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-2.5-flash
      - key: AISSTREAM_API_KEY
        sync: false
      - key: COPERNICUS_CLIENT_ID
        sync: false
      - key: COPERNICUS_CLIENT_SECRET
        sync: false
      - key: MAPTILER_KEY
        sync: false
      - key: ALERT_SCORE_THRESHOLD
        value: "70"
      - key: PIPELINE_INTERVAL_MINUTES
        value: "60"
      - key: BACKFILL_DAYS
        value: "60"
      - key: PUBLIC_BASE_URL
        value: https://sentinelcatch.onrender.com
      - key: ACCESS_CODE
        sync: false
      - key: MAP_STYLE_URL
        value: https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json

databases:
  - name: sentinelcatch-db
    plan: free
    databaseName: sentinelcatch
    region: frankfurt
